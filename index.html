<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0f">
    <title>Fable5 — Chat IA Multi-Modèles</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-tertiary: #1a1a25;
            --bg-input: #15151f;
            --border: #252535;
            --text-primary: #e8e8ed;
            --text-secondary: #9898a8;
            --text-muted: #686878;
            --accent: #d4a574;
            --accent-glow: rgba(212, 165, 116, 0.25);
            --accent-gradient: linear-gradient(135deg, #d4a574 0%, #c084fc 50%, #60a5fa 100%);
            --user-bubble: #1e1e30;
            --ai-bubble: #14141e;
            --danger: #f87171;
            --success: #4ade80;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh; height: 100dvh;
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        /* === SIDEBAR === */
        .sidebar {
            width: 280px; min-width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            transition: transform var(--transition); z-index: 10;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .sidebar-logo { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .sidebar-title { font-size: 15px; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .new-chat-btn { margin: 16px; padding: 12px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all var(--transition); font-family: inherit; }
        .new-chat-btn:hover { background: var(--bg-input); border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        .conversations { flex: 1; overflow-y: auto; padding: 8px; }
        .conv-item { padding: 12px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; color: var(--text-secondary); transition: all var(--transition); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
        .conv-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .conv-item.active { background: var(--bg-tertiary); color: var(--text-primary); }
        .conv-item .icon { font-size: 14px; flex-shrink: 0; }
        .conv-item .delete-btn { margin-left: auto; opacity: 0; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 4px; border-radius: 4px; transition: all var(--transition); }
        .conv-item:hover .delete-btn { opacity: 1; }
        .conv-item .delete-btn:hover { color: var(--danger); background: rgba(248,113,113,0.1); }
        .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); text-align: center; display: flex; flex-direction: column; gap: 6px; }
        .model-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg-tertiary); border-radius: 20px; font-size: 12px; color: var(--accent); border: 1px solid rgba(212,165,116,0.2); }
        .signout-btn { padding: 8px 16px; margin-top: 4px; background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all var(--transition); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .signout-btn:hover { color: var(--danger); border-color: var(--danger); background: rgba(248,113,113,0.08); }

        /* === MAIN === */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .main-header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg-secondary); }
        .main-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .main-title .dot { width: 7px; height: 7px; background: var(--success); border-radius: 50%; animation: pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }
        .header-actions { display: flex; gap: 6px; }
        .header-btn { padding: 6px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 12px; cursor: pointer; transition: all var(--transition); font-family: inherit; }
        .header-btn:hover { color: var(--text-primary); border-color: var(--text-muted); }

        /* === CHAT === */
        .chat-container { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 20px; padding: 40px; }
        .welcome-icon { width: 80px; height: 80px; border-radius: 24px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 8px 40px var(--accent-glow); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .welcome h1 { font-size: 28px; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .welcome p { color: var(--text-muted); font-size: 15px; max-width: 540px; line-height: 1.6; }
        .suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }
        .suggestion-chip { padding: 10px 18px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 24px; color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: all var(--transition); font-family: inherit; }
        .suggestion-chip:hover { border-color: var(--accent); color: var(--text-primary); background: var(--bg-input); box-shadow: 0 0 16px var(--accent-glow); }
        .message { display: flex; gap: 14px; padding: 16px 20px; border-radius: var(--radius-md); animation: msg-in 0.3s ease-out; }
        @keyframes msg-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { background: transparent; }
        .message.ai { background: var(--ai-bubble); }
        .msg-avatar { width: 34px; height: 34px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .msg-avatar.user-avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .msg-avatar.ai-avatar { background: var(--accent-gradient); }
        .msg-content { flex: 1; min-width: 0; }
        .msg-role { font-size: 11px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .msg-text { font-size: 15px; line-height: 1.7; color: var(--text-primary); overflow-wrap: anywhere; word-break: break-word; }
        .msg-text p { margin-bottom: 12px; }
        .msg-text p:last-child { margin-bottom: 0; }
        .msg-text pre { background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; overflow-x: auto; margin: 12px 0; font-size: 13px; line-height: 1.5; }
        .msg-text code { background: var(--bg-tertiary); padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
        .msg-text pre code { background: none; padding: 0; }
        .msg-text ul, .msg-text ol { margin: 8px 0; padding-left: 24px; }
        .msg-text li { margin-bottom: 4px; }
        .msg-text blockquote { border-left: 3px solid var(--accent); padding-left: 16px; margin: 12px 0; color: var(--text-secondary); }
        .msg-text table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
        .msg-text th, .msg-text td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        .msg-text th { background: var(--bg-tertiary); font-weight: 600; }
        .msg-actions { display: flex; gap: 8px; margin-top: 8px; }
        .msg-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: 4px; transition: all var(--transition); font-family: inherit; display: flex; align-items: center; gap: 4px; }
        .msg-action-btn:hover { color: var(--text-primary); background: var(--bg-tertiary); }
        .msg-action-btn.copied { color: var(--success); }
        .msg-attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        .msg-attachment-img { max-width: 200px; max-height: 200px; border-radius: var(--radius-sm); border: 1px solid var(--border); object-fit: cover; cursor: pointer; }
        .msg-attachment-pdf { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); }
        .typing-indicator { display: flex; gap: 14px; padding: 16px 20px; }
        .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
        .typing-dots span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

        /* === MODEL SELECTOR BAR (above input) === */
        .model-bar {
            padding: 8px 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .model-bar::-webkit-scrollbar { display: none; }
        .model-bar-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .model-chip {
            padding: 5px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all var(--transition);
            font-family: inherit;
        }
        .model-chip:hover, .model-chip:active { border-color: var(--accent); color: var(--text-primary); }
        .model-chip.selected {
            background: rgba(212,165,116,0.12);
            border-color: var(--accent);
            color: var(--accent);
        }
        .model-chip .vision-dot {
            display: inline-block;
            width: 5px; height: 5px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }

        /* === INPUT === */
        .input-area { padding: 10px 16px 16px; border-top: 1px solid var(--border); background: var(--bg-secondary); }
        .attachment-previews { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 8px 8px; }
        .attachment-preview { position: relative; display: inline-block; }
        .attachment-preview img { width: 64px; height: 64px; border-radius: var(--radius-sm); border: 1px solid var(--border); object-fit: cover; }
        .attachment-preview .pdf-preview { width: 64px; height: 64px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .attachment-preview .remove-attach { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); border: none; color: #fff; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
        .input-wrapper { display: flex; gap: 8px; align-items: flex-end; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 6px 6px 6px 14px; transition: all var(--transition); }
        .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        .input-wrapper textarea { flex: 1; background: none; border: none; color: var(--text-primary); font-size: 15px; font-family: inherit; resize: none; outline: none; min-height: 22px; max-height: 150px; line-height: 1.5; padding: 4px 0; }
        .input-wrapper textarea::placeholder { color: var(--text-muted); }
        .attach-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-tertiary); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all var(--transition); font-size: 16px; color: var(--text-muted); }
        .attach-btn:hover { border-color: var(--accent); color: var(--text-primary); }
        .send-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-gradient); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all var(--transition); font-size: 17px; opacity: 0.6; }
        .send-btn:hover { opacity: 1; transform: scale(1.05); box-shadow: 0 4px 20px var(--accent-glow); }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .send-btn.active { opacity: 1; }
        .input-footer { display: flex; justify-content: flex-end; align-items: center; margin-top: 6px; padding: 0 8px; }
        .input-footer span { font-size: 11px; color: var(--text-muted); }

        /* === MOBILE === */
        .menu-toggle { display: none; background: none; border: none; color: var(--text-primary); font-size: 22px; cursor: pointer; padding: 4px; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); z-index: 20; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            .menu-toggle { display: block; }
            .chat-container { padding: 12px; overflow-x: hidden; }
            .welcome h1 { font-size: 22px; }
            .message { padding: 12px 14px; gap: 10px; }
            .msg-text { font-size: 14px; }
            .msg-avatar { width: 28px; height: 28px; font-size: 14px; }
            .input-area { padding: 8px 10px 12px; }
            .input-wrapper { padding: 5px 5px 5px 12px; }
            .input-wrapper textarea { font-size: 14px; min-height: 20px; }
            .main-header { padding: 10px 14px; }
            .header-btn { padding: 5px 10px; font-size: 11px; }
            .send-btn { width: 34px; height: 34px; font-size: 15px; }
            .attach-btn { width: 32px; height: 32px; font-size: 14px; }
            .model-bar { padding: 6px 10px 0; gap: 6px; }
            .model-chip { padding: 4px 10px; font-size: 10px; }
            .katex { font-size: 0.95em; }
            .katex-display > .katex { font-size: 1.05em; }
            .attachment-preview img, .attachment-preview .pdf-preview { width: 48px; height: 48px; }
            .welcome p { font-size: 13px; max-width: 90%; }
            .suggestion-chip { font-size: 11px; padding: 8px 14px; }
        }

        /* === SCROLLBAR === */
        .conversations::-webkit-scrollbar { width: 4px; }
        .conversations::-webkit-scrollbar-track { background: transparent; }
        .conversations::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* === EMPTY STATE === */
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 14px; gap: 8px; }

        /* === KATEX DARK MODE === */
        .katex { color: var(--text-primary); font-size: 1.05em; }
        .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; -webkit-overflow-scrolling: touch; }
        .katex-display > .katex { font-size: 1.15em; max-width: 100%; }
        .katex .mathnormal { color: var(--text-primary); }
        .katex .mord { color: var(--text-primary); }
        .katex .mbin { color: #c084fc; }
        .katex .mrel { color: #c084fc; }
        .katex .mop { color: #60a5fa; }
        .katex .minner { color: var(--text-primary); }
        .katex .mopen, .katex .mclose { color: #94a3b8; }
        .katex .mpunct { color: #94a3b8; }
        .katex .mord.mathbf { color: #facc15; }
        .katex .mathit { color: #d4a574; }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">🧠</div>
        <span class="sidebar-title">Fable5</span>
    </div>
    <button class="new-chat-btn" onclick="newChat()"><span>✨</span> Nouvelle conversation</button>
    <div class="conversations" id="conversationList">
        <div class="empty-state"><span>💬</span><span>Aucune conversation</span></div>
    </div>
    <div class="sidebar-footer">
        <span class="model-badge" id="sidebarModelBadge">🧬 Claude Fable 5</span>
        <button class="signout-btn" onclick="signOutPuter()" title="Changer de compte Puter">🔄 Changer de compte</button>
        <span>Propulsé par Puter.js</span>
    </div>
</aside>

<main class="main">
    <header class="main-header">
        <div style="display:flex;align-items:center;gap:12px;">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <div class="main-title">
                <span id="currentChatTitle">Nouvelle conversation</span>
                <span class="dot"></span>
            </div>
        </div>
        <div class="header-actions">
            <button class="header-btn" onclick="newChat()">✨ Nouveau</button>
            <button class="header-btn" onclick="exportChat()">📥 Exporter</button>
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcomeScreen">
            <div class="welcome-icon">🧠</div>
            <h1>Fable5</h1>
            <p>Chat IA multi-modèles gratuit : Claude, GPT, Gemini, Grok, DeepSeek, Llama et plus. <br>📎 <strong>Envoyez des images</strong> avec les modèles compatibles vision. Choisissez votre modèle ci-dessous.</p>
            <div class="suggestions">
                <button class="suggestion-chip" onclick="sendSuggestion(this)">📝 Écris un essai sur l'IA éthique</button>
                <button class="suggestion-chip" onclick="sendSuggestion(this)">💻 Explique-moi les monades en programmation</button>
                <button class="suggestion-chip" onclick="sendSuggestion(this)">🔬 Résoudre ce puzzle logique complexe</button>
                <button class="suggestion-chip" onclick="sendSuggestion(this)">🌍 Compare les modèles économiques mondiaux</button>
            </div>
        </div>
    </div>

    <!-- MODEL SELECTOR BAR (always visible above input) -->
    <div class="model-bar" id="modelBar"></div>

    <div class="input-area">
        <div class="attachment-previews" id="attachmentPreviews"></div>
        <div class="input-wrapper">
            <button class="attach-btn" id="attachBtn" onclick="document.getElementById('fileInput').click()" title="Joindre image ou PDF">🎎</button>
            <textarea id="userInput" placeholder="Posez votre question..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize()"></textarea>
            <input type="file" id="fileInput" multiple accept="image/*,.pdf" style="display:none" onchange="handleFileSelect(event)">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
        </div>
        <div class="input-footer">
            <span id="charCount">0 / 4000</span>
        </div>
    </div>
</main>

<script>
const MODEL_INFO = {
    'claude-fable-5':              { name: 'Claude Fable 5', provider: 'Anthropic', emoji: '🧬', vision: true },
    'anthropic/claude-opus-4-8':   { name: 'Claude Opus 4.8', provider: 'Anthropic', emoji: '🧠', vision: true },
    'anthropic/claude-sonnet-5':   { name: 'Claude Sonnet 5', provider: 'Anthropic', emoji: '💡', vision: true },
    'openai/gpt-5.5':              { name: 'GPT-5.5', provider: 'OpenAI', emoji: '⚁', vision: true },
    'openai/gpt-4o-mini':          { name: 'GPT-4o Mini', provider: 'OpenAI', emoji: '🚀', vision: true },
    'openai/o4-mini':              { name: 'o4-mini', provider: 'OpenAI', emoji: '🔮', vision: false },
    'openai/o3-mini':              { name: 'o3-mini', provider: 'OpenAI', emoji: '🎯', vision: false },
    'google/gemini-3.5-flash':     { name: 'Gemini 3.5 Flash', provider: 'Google', emoji: '💎 , vision: true },
    'google/gemini-2.5-pro':       { name: 'Gemini 2.5 Pro', provider: 'Google', emoji: '🔬, vision: true },
    'x-ai/grok-4.5':               { name: 'Grok 4.5', provider: 'xAI', emoji: '🐦, vision: true },
    'x-ai/grok-4.1-fast':          { name: 'Grok 4.1 Fast', provider: 'xAI', emoji: '⚡', vision: true },
    'microsoft/phi-4':             { name: 'Phi-4', provider: 'Microsoft', emoji: '📐', vision: false },
    'deepseek/deepseek-r1':        { name: 'DeepSeek R1', provider: 'DeepSeek', emoji: '🐋', vision: false },
    'meta-llama/llama-4-maverick': { name: 'Llama 4 Maverick', provider: 'Meta', emoji: '🦙', vision: false },
    'mistralai/mistral-large-2':   { name: 'Mistral Large 2', provider: 'Mistral AI', emoji: '💨', vision: false },
    'z-ai/glm-5.2':                { name: 'GLM 5.2', provider: 'Z.AI', emoji: '🏯', vision: false }
};

function getModelInfo(modelId) {
    return MODEL_INFO[modelId] || { name: modelId, provider: 'Unknown', emoji: '🤖', vision: false };
}

const STATE_KEY = 'fable5-chat-state';
const DEFAULT_MODEL = 'claude-fable-5';
let state = loadState();
let currentStreaming = null;
let attachments = [];

function defaultState() {
    return { conversations: {}, activeConvId: null, convOrder: [], selectedModel: DEFAULT_MODEL };
}

function loadState() {
    try {
        const saved = localStorage.getItem(STATE_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            const merged = { ...defaultState(), ...parsed };
            if (!MODEL_INFO[merged.selectedModel]) merged.selectedModel = DEFAULT_MODEL;
            return merged;
        }
    } catch(e) {}
    return defaultState();
}

function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
function getActiveConv() { return (state.activeConvId && state.conversations[state.activeConvId]) ? state.conversations[state.activeConvId] : null; }
function createConv() {
    const id = 'conv_' + Date.now();
    const conv = { id, title: 'Nouvelle conversation', messages: [], createdAt: new Date().toISOString() };
    state.conversations[id] = conv; state.convOrder.unshift(id); state.activeConvId = id;
    saveState(); return conv;
}

function renderModelBar() {
    const bar = document.getElementById('modelBar');
    if (!bar) return;
    let html = '<span class="model-bar-label">Modèle :</span>';
    for (const [id, m] of Object.entries(MODEL_INFO)) {
        const sel = id === state.selectedModel ? ' selected' : '';
        const vDot = m.vision ? '<span class="vision-dot" title="Compatible vision"></span>' : '';
        html += `<button class="model-chip${sel}" onclick="selectModel('${id}')" title="${m.vision ? '✅ Analyse image/PDF' : '❌ Texte uniquement'}">${vDot}${m.emoji} ${m.name}</button>`;
    }
    bar.innerHTML = html;
    setTimeout(() => {
        const sel = bar.querySelector('.model-chip.selected');
        if (sel) sel.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }, 100);
}

function selectModel(id) {
    if (!MODEL_INFO[id]) return;
    state.selectedModel = id; saveState();
    updateModelUI(); renderModelBar();
    if (!getModelInfo(id).vision && attachments.length > 0) {
        alert(getModelInfo(id).name + ' ne supporte pas les images.');
    }
    document.getElementById('userInput').focus();
}

function updateModelUI() {
    const info = getModelInfo(state.selectedModel);
    const badge = document.getElementById('sidebarModelBadge');
    if (badge) badge.textContent = info.emoji + ' ' + info.name;
    const textarea = document.getElementById('userInput');
    if (textarea) textarea.placeholder = 'Posez votre question à ' + info.name + '...';
}

function resizeImage(file, maxW, quality) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxW || h > maxW) {
                const ratio = Math.min(maxW / w, maxW / h);
                w = Math.round(w * ratio);
                h = Math.round(h * ratio);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('Cannot load image'));
        img.src = URL.createObjectURL(file);
    });
}

function handleFileSelect(event) {
    const files = Array.from(event.target.files);
    if (files.length === 0) return;
    
    if (!getModelInfo(state.selectedModel).vision) {
        alert('Ce modèle ne supporte pas les images. Choisissez un modèle avec vision (💚 vert).');
        event.target.value = ''; return;
    }

    if (attachments.length + files.length > 5) {
        alert('Maximum 5 fichiers.');
        event.target.value = ''; return;
    }

    files.forEach(async file => {
        if (file.size > 20 * 1024 * 1024) { alert(file.name + ' dépasse 20 Mo.'); return; }
        const type = file.type.startsWith('image/') ? 'image' : 'pdf';
        if (type === 'image') {
            try {
                const dataUrl = await resizeImage(file, 800, 0.7);
                attachments.push({ file, dataUrl, type: 'image' });
                renderAttachments();
            } catch(e) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    attachments.push({ file, dataUrl: ev.target.result, type: 'image' });
                    renderAttachments();
                };
                reader.readAsDataURL(file);
            }
        } else {
            attachments.push({ file, dataUrl: null, type: 'pdf' });
            renderAttachments();
        }
    });
    event.target.value = '';
}

function removeAttachment(idx) { attachments.splice(idx, 1); renderAttachments(); }

function renderAttachments() {
    const ct = document.getElementById('attachmentPreviews');
    if (attachments.length === 0) { ct.innerHTML = ''; return; }
    ct.innerHTML = attachments.map((a, i) => {
        if (a.type === 'image' && a.dataUrl) return `<div class="attachment-preview"><img src="${a.dataUrl}"><button class="remove-attach" onclick="removeAttachment(${i})">✕</button></div>`;
        return `<div class="attachment-preview"><div class="pdf-preview">📄</div><button class="remove-attach" onclick="removeAttachment(${i})">✕</button></div>`;
    }).join('');
}

function renderSidebar() {
    const list = document.getElementById('conversationList');
    if (state.convOrder.length === 0) {
        list.innerHTML = '<div class="empty-state"><span>💬</span><span>Aucune conversation</span></div>'; return;
    }
    list.innerHTML = state.convOrder.map(id => {
        const conv = state.conversations[id]; if (!conv) return '';
        const active = id === state.activeConvId ? ' active' : '';
        return `<div class="conv-item${active}" onclick="switchConv('${id}')"><span class="icon">💬</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(conv.title || 'Nouvelle conversation')}</span><button class="delete-btn" onclick="event.stopPropagation();deleteConv('${id}')" title="Supprimer">🗑</button></div>`;
    }).join('');
}

function renderMessages() {
    const container = document.getElementById('chatContainer'), welcome = document.getElementById('welcomeScreen'), conv = getActiveConv(), info = getModelInfo(state.selectedModel);
    if (!conv || conv.messages.length === 0) {
        container.innerHTML = ''; container.appendChild(welcome);
        welcome.style.display = 'flex';
        document.getElementById('currentChatTitle').textContent = 'Nouvelle conversation'; return;
    }
    welcome.style.display = 'none';
    document.getElementById('currentChatTitle').textContent = conv.title || 'Nouvelle conversation';
    let html = '';
    conv.messages.forEach((msg, idx) => {
        const roleLabel = msg.role === 'user' ? 'VOUS' : info.name.toUpperCase();
        const avatarEmoji = msg.role === 'user' ? '👤' : info.emoji;
        const renderedContent = msg.role === 'ai' ? renderMarkdown(msg.content) : escapeHtml(msg.content);
        const attachHtml = (msg.attachments && msg.attachments.length > 0) ? renderMsgAttachments(msg.attachments) : '';
        html += `<div class="message ${msg.role}"><div class="msg-avatar ${msg.role === 'user' ? 'user-avatar' : 'ai-avatar'}">${avatarEmoji}</div><div class="msg-content"><div class="msg-role">${roleLabel}</div>${attachHtml}<div class="msg-text">${renderedContent}</div>${msg.role === 'ai' ? `<div class="msg-actions"><button class="msg-action-btn" onclick="copyMessage(${idx})">📋 Copier</button></div>` : ''}</div></div>`;
    });
    container.innerHTML = html; container.appendChild(welcome);
    welcome.style.display = 'none'; scrollToBottom();
}

function renderMsgAttachments(attachments) {
    return '<div class="msg-attachments">' + attachments.map(a => {
        if (a.type === 'image') return `<img class="msg-attachment-img" src="${a.dataUrl}" onclick="window.open('${a.dataUrl}')" title="${a.name}">`;
        return `<div class="msg-attachment-pdf">📄 ${a.name}</div>`;
    }).join('') + '</div>';
}

function renderMarkdown(text) {
    if (!text) return '';
    const mathBlocks = [], PH = '\u29FC', PE = '\u29FD';
    text = text.replace(/\\\[([\s\S]*?)\\\]/g, (m,f) => { const i=mathBlocks.length; mathBlocks.push({type:'display',formula:f.trim()}); return PH+i+PE; });
    text = text.replace(/\\\(([^\n]+?)\\\)/g, (m,f) => { const i=mathBlocks.length; mathBlocks.push({type:'inline',formula:f.trim()}); return PH+i+PE; });
    text = text.replace(/\$\$([\s\S]*?)\$\$/g, (m,f) => { const i=mathBlocks.length; mathBlocks.push({type:'display',formula:f.trim()}); return PH+i+PE; });
    text = text.replace(/\$([^\$\n]+?)\$/g, (m,f) => { const i=mathBlocks.length; mathBlocks.push({type:'inline',formula:f.trim()}); return PH+i+PE; });
    let html;
    if (typeof marked !== 'undefined') { marked.setOptions({breaks:true,gfm:true}); html = marked.parse(text); }
    else { html = escapeHtml(text).replace(/\n/g,'<br>'); }
    for (let i=mathBlocks.length-1; i>=0; i--) {
        try { html = html.replace(PH+i+PE, katex.renderToString(mathBlocks[i].formula, {displayMode:mathBlocks[i].type==='display',throwOnError:false,strict:false})); }
        catch(e) { html = html.replace(PH+i+PE, '<code>'+escapeHtml(mathBlocks[i].formula)+'</code>'); }
    }
    return html;
}

function escapeHtml(str) { const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function scrollToBottom() { requestAnimationFrame(() => { const c=document.getElementById('chatContainer'); c.scrollTop=c.scrollHeight; }); }
function autoResize() {
    const ta=document.getElementById('userInput'); ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,150)+'px';
    const len=ta.value.length;
    document.getElementById('charCount').textContent=`${len} / 4000`;
    document.getElementById('sendBtn').disabled = (len === 0 && attachments.length === 0);
    if (len > 0 || attachments.length > 0) document.getElementById('sendBtn').classList.add('active');
    else document.getElementById('sendBtn').classList.remove('active');
}

function addTypingIndicator() {
    const container=document.getElementById('chatContainer'), welcome=document.getElementById('welcomeScreen');
    if (welcome) welcome.style.display='none';
    const info=getModelInfo(state.selectedModel);
    const el=document.createElement('div'); el.className='message ai'; el.id='typingIndicator';
    el.innerHTML=`<div class="msg-avatar ai-avatar">${info.emoji}</div><div class="msg-content"><div class="msg-role">${info.name.toUpperCase()}</div><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    container.appendChild(el); scrollToBottom();
}
function removeTypingIndicator() { const el=document.getElementById('typingIndicator'); if(el) el.remove(); }

function newChat() {
    createConv(); renderSidebar(); renderMessages(); renderModelBar();
    document.getElementById('userInput').value=''; document.getElementById('userInput').style.height='auto';
    document.getElementById('sendBtn').disabled=true; document.getElementById('sendBtn').classList.remove('active');
    document.getElementById('charCount').textContent='0 / 4000';
    attachments = []; renderAttachments();
    document.getElementById('userInput').focus(); closeSidebar();
}
function switchConv(id) { state.activeConvId=id; saveState(); renderSidebar(); renderMessages(); document.getElementById('userInput').focus(); closeSidebar(); }
function deleteConv(id) {
    if (!confirm('Supprimer cette conversation ?')) return;
    delete state.conversations[id]; state.convOrder=state.convOrder.filter(cid=>cid!==id);
    if (state.activeConvId===id) state.activeConvId=state.convOrder.length>0?state.convOrder[0]:null;
    saveState(); renderSidebar(); renderMessages();
    if (!state.activeConvId) { const w=document.getElementById('welcomeScreen'); if(w) w.style.display='flex'; }
}

async function sendMessage() {
    const input = document.getElementById('userInput');
    const content = input.value.trim();
    if (!content && attachments.length === 0) return;
    if (content.length > 4000) return;

    let conv = getActiveConv(); if (!conv) conv = createConv();

    const msgAttachments = attachments.map(a => ({ type: a.type, dataUrl: a.dataUrl || null, name: a.file.name }));
    conv.messages.push({ role: 'user', content: content || '(Pièce jointe)', attachments: msgAttachments });
    if (conv.messages.length === 1) conv.title = (content || 'Image').slice(0, 50) + ((content || '').length > 50 ? '...' : '');

    input.value = ''; input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true; document.getElementById('sendBtn').classList.remove('active');
    document.getElementById('charCount').textContent = '0 / 4000';
    attachments = []; renderAttachments();
    saveState(); renderSidebar(); renderMessages();

    const aiMsgIdx = conv.messages.length;
    conv.messages.push({ role: 'ai', content: '' });
    saveState(); renderMessages(); addTypingIndicator();

    const messages = conv.messages.filter(m => m.role !== 'ai' || m.content !== '')
        .map(m => `${m.role === 'user' ? 'User' : 'Assistant'}: ${m.content}`).join('\n\n');
    const fullPrompt = messages + '\n\nAssistant: ';

    try {
        const imgAtt = msgAttachments.filter(a => a.type === 'image' && a.dataUrl);
        let response;
        if (imgAtt.length > 0) {
            response = await puter.ai.chat(fullPrompt, imgAtt[0].dataUrl, { model: state.selectedModel, stream: true });
        } else if (msgAttachments.length > 0) {
            const f = msgAttachments[0];
            const note = f.type === 'pdf' ? '\n\n[PDF ' + f.name + ' joint]' : '';
            response = await puter.ai.chat(fullPrompt + note, { model: state.selectedModel, stream: true });
        } else {
            response = await puter.ai.chat(fullPrompt, { model: state.selectedModel, stream: true });
        }

        removeTypingIndicator();
        let fullContent = '';
        for await (const part of response) {
            if (part?.text) { fullContent += part.text; conv.messages[aiMsgIdx].content = fullContent; saveState(); updateAiMessage(aiMsgIdx, fullContent); scrollToBottom(); }
        }
        if (!fullContent) conv.messages[aiMsgIdx].content = '_(Aucune réponse reçue)_';
    } catch (err) {
        removeTypingIndicator(); console.error('Erreur:', err);
        conv.messages[aiMsgIdx].content = `❌ **Erreur**: ' + escapeHtml(err.message || 'Inconnue') + '.';
    }
    saveState(); renderMessages(); document.getElementById('userInput').focus();
}

function updateAiMessage(idx, content) {
    const container=document.getElementById('chatContainer'), messages=container.querySelectorAll('.message.ai'), conv=getActiveConv();
    if (!conv) return;
    const aiMsgs=conv.messages.filter(m=>m.role==='ai');
    const localIdx=aiMsgs.findIndex((m,i)=>conv.messages.indexOf(m)===idx);
    if (localIdx>=0 && messages[localIdx]) { const t=messages[localIdx].querySelector('.msg-text'); if(t) t.innerHTML=renderMarkdown(content); }
}

function sendSuggestion(btn) {
    document.getElementById('userInput').value=btn.textContent.replace(/^[^\s]+\s/,''); autoResize();
    document.getElementById('sendBtn').disabled=false; document.getElementById('sendBtn').classList.add('active');
    sendMessage();
}
function handleKeyDown(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); if (!document.getElementById('sendBtn').disabled) sendMessage(); } }
function copyMessage(idx) {
    const conv=getActiveConv(); if (!conv||!conv.messages[idx]) return;
    navigator.clipboard.writeText(conv.messages[idx].content).then(()=>{
        const btns=document.getElementById('chatContainer').querySelectorAll('.msg-action-btn');
        let bId=0;
        for (let i=0;i<conv.messages.length&&i<=idx;i++) { if (conv.messages[i].role==='ai') { if(i===idx)break; bId++; } }
        if (btns[bId]) { btns[bId].textContent='✅ Copié !'; btns[bId].classList.add('copied'); setTimeout(()=>{btns[bId].textContent='📋 Copier';btns[bId].classList.remove('copied');},1500); }
    });
}
function exportChat() {
    const conv=getActiveConv(); if (!conv||conv.messages.length===0) { alert('Aucune conversation à exporter.'); return; }
    const info=getModelInfo(state.selectedModel);
    let text=`# ${conv.title}\n\nDate: ${new Date(conv.createdAt).toLocaleString()}\nModèle: ${info.name} (${info.provider})\n\n---\n\n`;
    conv.messages.forEach(msg=>{ text+=` ## ${msg.role==='user'?'👤 Vous':info.emoji+' '+info.name}\n\n${msg.content}\n\n`; });
    const blob=new Blob([text],{type:'text/markdown'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`fable5-chat-${conv.id}.md`; a.click(); URL.revokeObjectURL(url);
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }
document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

function signOutPuter() {
    if (!confirm('Déconnexion : cela effacera vos conversations et vous permettra de vous connecter avec un autre compte Puter. Continuer ?')) return;
    try { puter.auth.signOut(); } catch(e) { console.log('Puter signOut:', e); }
    localStorage.clear(); location.reload();
}

function init() {
    updateModelUI();
    renderModelBar();
    renderSidebar();
    if (state.activeConvId && state.conversations[state.activeConvId]) renderMessages();
    else if (state.convOrder.length > 0) { state.activeConvId = state.convOrder[0]; saveState(); renderMessages(); }
    document.getElementById('userInput').focus();
    autoResize();
}
init();
</script>
